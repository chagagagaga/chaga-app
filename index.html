<style>

  @media (prefers-color-scheme: dark) { :root { --bg:#16131a; --card:#221d26; --ink:#f3ead9; --mute:#a397a8; --line:#352d3b; --acc:#ffc857; --ok:#7ccf8f; --bad:#ff8a7a; --chip:#2e2733; } }

  #dlg .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } #dlg button { padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
  #dlg button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
.thg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.thg figure.best{grid-column:1/-1}.thg figure{margin:0;border-radius:10px;overflow:hidden;border:2px solid transparent}.thg figure.best{border-color:#f2c21a}.thg img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}.thg figcaption{font-size:12px;padding:4px 6px;opacity:.85}

<body>
<header><h1>CHAGA CARTOONS<small id="upd"></small></h1><nav id="tabs"></nav></header>
<main id="list"><div id="msg">Загружаю…</div></main>
<script>
const TG = window.Telegram && Telegram.WebApp; if (TG) { TG.ready(); TG.expand(); }
const K = new URLSearchParams(location.hash.slice(1)).get("k") || localStorage.getItem("chaga_k");
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
let D = null, TAB = localStorage.getItem("chaga_tab") || "you-s";
if (TAB === "you") TAB = "you-s";
// «Ждут тебя» делится на две папки и стоит первой: сценарии и готовые ролики
const YOU = { "you-s": ["📝 Сценарии ждут тебя", "script"], "you-r": ["🎬 Ролики ждут тебя", "reel"] };
// 12.11 P0: «Ждут тебя» = ready_items() бота (поле wait из data.bin): короткие «you» и снятые с выкладки (hold-1211)
const waits = (i) => i.wait || (i.wait === undefined && i.status === "you");
const inTab = (i, t) => YOU[t] ? waits(i) && i.kind === YOU[t][1] : i.status === t && !waits(i);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https:\/\//i.test(String(u || "")) ? esc(u) : "";   // только https: никаких javascript:

async function open(buf) {
  const ck = await crypto.subtle.importKey("raw", b64(K), "AES-GCM", false, ["decrypt"]);
  const u = new Uint8Array(buf);                   // subarray: без лишней копии (на iPhone память дорогая)
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, ck, u.subarray(12));
}
// 06.11 (письма «pages build failed»: сайт Pages возил ~400 МБ видео и выкладывался на каждый апдейт): данные лежат в
// ветке appdata, видео v/ и части длинных lv/ в ветке appmedia того же репозитория, на Pages только страница.
// Данные: GitHub API (свежие сразу) -> raw (кэш CDN до 5 мин) -> старый путь на Pages. Медиа: raw (без лимита API,
// имена с хэшем не меняются) -> API -> Pages. API без токена = 60 запросов в час на IP: при 403/429 API на 15 мин пропускаем.
const GH_API = "https://api.github.com/repos/chagagagaga/chaga-app/contents/", GH_RAW = "https://raw.githubusercontent.com/chagagagaga/chaga-app/";
let API_OFF = 0;
async function fetchFirst(srcs) {
  let last = null;
  for (const s of srcs) {
    if (s.api && Date.now() < API_OFF) continue;
    try {
      const r = await fetch(s.u, s.init || {});
      if (r.ok) return r;
      if (s.api && (r.status === 403 || r.status === 429)) API_OFF = Date.now() + 15 * 60e3;
      last = new Error("HTTP " + r.status);
    } catch (e) { last = e; }
  }
  throw last || new Error("нет источника");
}
const RAWH = { headers: { Accept: "application/vnd.github.raw" } };
const dataSrcs = () => [{ u: GH_API + "data.bin?ref=appdata", api: true, init: { ...RAWH, cache: "no-cache" } },
  { u: GH_RAW + "appdata/data.bin?t=" + Date.now(), init: { cache: "no-store" } }, { u: "data.bin?" + Date.now(), init: { cache: "no-store" } }];
const mediaSrcs = (p) => [{ u: GH_RAW + "appmedia/" + p }, { u: GH_API + p + "?ref=appmedia", api: true, init: RAWH }, { u: p }];
async function load() {
  if (!K) { document.getElementById("msg").textContent = "Нет ключа: открой ссылку из бота (/app)."; return; }
  try { localStorage.setItem("chaga_k", K); } catch (e) {}
  const r = await fetchFirst(dataSrcs());
  const plain = await open(await r.arrayBuffer());
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  if (txt === LAST) return;                        // 30.10: данные не менялись: не перерисовываем (раньше раз в минуту обнулялся ролик)
  LAST = txt; D = JSON.parse(txt);
  for (const c of pend()) {
    if (String(c.id || "").startsWith("L-")) { const v = longAll().find((x) => x.id === c.id); if (v && v.status === "ready") setLocal(c.id, c.st, ""); continue; }
    const it = c.id && D.items.find((x) => x.id === c.id); if (it && waits(it)) { it.status = c.st; it.wait = false; }
  }   // команды из очереди: статус не откатывается
  render();
}
let LAST = "";
const VID = {};                                     // плееры по пути ролика: переживают перерисовку, позиция и воспроизведение сохраняются
// кнопки работают в самом приложении: команда шифруется ключом приложения и уходит в закрытый ящик ntfy.sh
// (адрес ящика выводится из ключа), бот забирает её каждые 30 с. Без ключа команду не подделать.
async function topic(kind) { const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("chaga-" + (kind || "cmd") + ":" + K))); return "chaga-" + Array.from(h.slice(0, 16), (x) => x.toString(16).padStart(2, "0")).join(""); }
// 12.11 P0: бот отвечает приложению (зашифрованно) в свой ящик ntfy «ack»: приложение знает, что команда дошла
async function waitAck(n, ms) {
  const t0 = Date.now(), since = Math.floor(t0 / 1000) - 5, tp = await topic("ack");
  while (Date.now() - t0 < ms) {
    try {
      const r = await fetch(`https://ntfy.sh/${tp}/json?poll=1&since=${since}`, { cache: "no-store" });
      if (r.ok) for (const line of (await r.text()).split("\n")) {
        if (!line.trim()) continue; let ev; try { ev = JSON.parse(line); } catch (e) { continue; }
        if (ev.event !== "message") continue;
        try { const d = JSON.parse(new TextDecoder().decode(await open(b64(ev.message).buffer))); if (String(d.n) === String(n)) return d; } catch (e) {}
      }
    } catch (e) {}
    await new Promise((res) => setTimeout(res, 2500));
  }
  return null;
}
// 12.11 P0: window.prompt в Telegram WebView не показывается: свой диалог с большим полем
function ask(title, need) {
  return new Promise((done) => {
    let d = document.getElementById("dlg");
    if (!d) { d = document.createElement("div"); d.id = "dlg"; d.innerHTML = `<div class="box"><b></b><textarea></textarea><div class="row"><button data-x="no">Отмена</button><button class="ok" data-x="ok">Отправить</button></div></div>`; document.body.appendChild(d); }
    const ta = d.querySelector("textarea"); d.querySelector("b").textContent = title; ta.value = ""; d.className = "on"; setTimeout(() => ta.focus(), 50);
    const fin = (v) => { d.className = ""; d.onclick = null; done(v); };
    d.onclick = (e) => { const x = e.target.dataset && e.target.dataset.x; if (e.target === d || x === "no") fin(null); else if (x === "ok") { if (need && !ta.value.trim()) { ta.focus(); return; } fin(ta.value); } };
  });
}
async function seal(obj) {
  const ck = await crypto.subtle.importKey("raw", b64(K), "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  let raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream)                    // gzip: длинные правки влезают в лимит ntfy (4 КБ), бот распакует
    raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, ck, raw));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return btoa(String.fromCharCode(...all));
}
function toast(t) { let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); } el.textContent = t; el.className = "show"; clearTimeout(el._t); el._t = setTimeout(() => el.className = "", 2600); }
const LABEL = { ap: "✅ Беру", ed: "✏️ Правки", rw: "❌ Переделать", tr: "🗑 В мусор", vo: "🎙 Голосом", la: "✅ Одобрено", le: "✏️ Замечание", un: "↩️ Отменить" }, NEXT = { ap: "approved", ed: "edits", rw: "edits", tr: "rejected", la: "L:approved", le: "L:edits", un: "you" };
// локальный статус после кнопки (до подтверждения ботом): короткие в D.items, длинные (id L-...) в D.long
function setLocal(id, st, text) {
  if (String(id).startsWith("L-")) { const v = longAll().find((x) => x.id === id); if (v && st) { v.status = st.replace(/^L:/, ""); v.label = (D.long.statuses || {})[v.status] || v.status; if (text) (v.notes = v.notes || []).push("сейчас " + text); } return; }
  const it = D.items.find((x) => x.id === id); if (it) { if (!(it.held && st !== "you" && it.status === "published")) it.status = st; it.wait = st === "you"; it.undo_until = st === "you" ? 0 : Date.now() / 1000 + 600; if (text) it.notes = ((it.notes || "") + "\n" + text).trim(); }
}
// очередь неотправленных команд (лимит ntfy / нет сети): повтор раз в 2 минуты и при каждом открытии, команды уже зашифрованы
function pend() { try { return JSON.parse(localStorage.getItem("chaga_pending") || "[]"); } catch (e) { return []; } }
function queue(body, id, st) { const q = pend(); q.push({ body, id, st }); try { localStorage.setItem("chaga_pending", JSON.stringify(q)); } catch (e) {} }
async function flush() {
  let q = pend(); if (!q.length || !K) return; const sent = q.length;
  while (q.length) {
    let r = null; try { r = await fetch("https://ntfy.sh/" + await topic(), { method: "POST", body: q[0].body || q[0] }); } catch (x) {}
    if (!r || !r.ok) break;
    q.shift(); try { localStorage.setItem("chaga_pending", JSON.stringify(q)); } catch (e) {}
  }
  if (q.length < sent) toast(`Дослал из очереди: ${sent - q.length}${q.length ? ", ждут ещё " + q.length : ""}.`);
}
setInterval(flush, 120e3); setTimeout(flush, 3e3);
async function act(a, id) {
  let text = "";
  if (a === "ed" || a === "rw" || a === "le") { text = await ask(a === "ed" ? "Правки к карточке " + id : a === "le" ? "Замечание к длинному ролику " + id : "Что не так? (можно пусто) " + id, a !== "rw"); if (text === null) return; }
  try {
    const n = crypto.getRandomValues(new Uint32Array(2)).join("");
    const body = await seal({ a, id, text: text.trim(), ts: Date.now(), n });
    // ntfy превращает сообщения > 4096 байт во вложение, и бот их не прочтёт: не отправляем, просим разделить
    if (body.length > 3800) { toast("Слишком длинная правка для одной отправки. Раздели на части и отправь по очереди."); return; }
    let r = null; try { r = await fetch("https://ntfy.sh/" + await topic(), { method: "POST", body }); } catch (x) {}
    // 30.10: лимит ntfy (429, ~250 сообщений в сутки на IP, сброс 00:00 UTC) или нет сети: команда в очередь, приложение дошлёт само
    if (!r || r.status === 429 || r.status >= 500) {
      if (a === "vo") throw new Error(r ? "ntfy " + r.status : "нет сети");
      queue(body, id, NEXT[a]); setLocal(id, NEXT[a], text.trim());
      toast(`${LABEL[a]}: ${id}. ntfy ${r ? "упёрся в дневной лимит" : "недоступен"}, сохранил в очередь: дошлю сам, как откроется.`); render(); return;
    }
    if (!r.ok) throw new Error("ntfy " + r.status);
    if (a === "vo") {                                // 12.11 P0: сначала подтверждение бота, потом в чат (раньше закрывалось сразу: гонка)
      toast("🎙 Жду подтверждения бота…");
      const ack = await waitAck(n, 45e3);
      toast(ack ? "🎙 Бот ждёт голосовое по " + id + ". Запиши его в чате." : "🎙 Бот пока молчит. Запиши голосовое в чате: он применит его, когда команда дойдёт.");
      if (TG) setTimeout(() => TG.close(), 1200); else setTimeout(() => { location.href = "https://t.me/chaga_cartoons_bot"; }, 1200);
      return;
    }
    setLocal(id, NEXT[a], text.trim());
    toast(`${LABEL[a]}: ${id}. Отправил боту…`); render();
    waitAck(n, 90e3).then((ack) => toast(ack ? (ack.ok ? "Бот записал: " : "Бот: ") + ack.msg.slice(0, 160) : `${LABEL[a]}: ${id}. Бот пока не подтвердил, запишет, когда дойдёт.`));
  } catch (e) { toast("Не отправилось: " + e.message + ". Попробуй ещё раз."); }
}
// 08.11 (Алексей: «нажимаю play — видео не включается»): раньше каждая открытая карточка сразу качала свой ролик,
// 21 ролик ~250 МБ параллельно, и у видео не было src, пока всё не докачается (на iPhone не докачивалось вовсе).
// Теперь ролик качается только по нажатию «▶ Смотреть»: прогресс на экране, после загрузки включается сам.
// В памяти держим только последний открытый ролик (и тот, что играет).
async function video(el, path, gesture) {
  const v = el.querySelector("video"), say = (t, bad) => { const m = el.querySelector(".vmsg"); if (m) { m.textContent = t; m.classList.toggle("err", !!bad); } };
  if (gesture) { try { v.play().catch(() => {}); } catch (e) {} }   // iPhone: «будим» плеер в самом нажатии
  say("загружаю…");

    ${(v.history || []).length ? `<details><summary>История</summary><div class="hist">${esc(v.history.join("\n"))}</div></details>` : ""}</div>`;
}
// 01.11: оценки ревьюеров длинного (review.json проекта: круги, оценки, блокеры, вердикт, summary_ru)
const RVN = { CHIEF: "👑 Главный", VISUAL_QA: "🎞 Визуал QA", STRICT: "💀 Строгий зритель", FACTCHECK: "🔎 Факты", SAFETY: "🛡 Безопасность" };
const scChips = (sc) => Object.entries(sc || {}).map(([k, x]) => `<span class="chip ${x >= 8 ? "hi" : x < 7 ? "lo" : ""}">${esc(RVN[k] || k)} ${esc(x)}</span>`).join("");
const blN = (b) => Object.values(b || {}).reduce((a, x) => a + (+x || 0), 0);
const blTxt = (b) => Object.entries(b || {}).filter(([, x]) => +x).map(([k, x]) => `${RVN[k] || k}: ${x}`).join(", ");
const verd = (x) => x ? `<span class="chip ${/НЕ/i.test(x) ? "no" : "ok"}">${/НЕ/i.test(x) ? "❌" : "✅"} ${esc(x)}</span>` : "";
function review(v) {
  const R = v.review;
  if (!R || !((R.rounds || []).length || R.final)) return "";
  const rs = R.rounds || [], fin = R.final || rs[rs.length - 1] || {};
  const fr = rs.find((r) => r.round === fin.round) || rs[rs.length - 1] || {};
  const bl = fin.blockers || fr.blockers || {}, n = blN(bl), sum = fin.summary_ru || fr.summary_ru || "";
  const hist = rs.slice().reverse().map((r) => `<div class="rnd"><b>Круг ${esc(r.round)}</b>${r.at ? " · " + esc(r.at) : ""}${r.video ? " · " + esc(r.video) : ""}
    <div class="chips">${verd(r.verdict)}${scChips(r.scores)}<span class="chip ${blN(r.blockers) ? "lo" : ""}">⛔ ${blN(r.blockers)} бл.</span></div>
    ${blN(r.blockers) ? `<div class="note">Блокеры: ${esc(blTxt(r.blockers))}</div>` : ""}
    ${r.summary_ru ? `<details><summary>Сводка</summary><div class="text">${esc(r.summary_ru)}</div></details>` : ""}
    ${Object.keys(r.reports || {}).length ? `<details><summary>Отчёты ревьюеров</summary><div class="text">${esc(Object.entries(r.reports).map(([k, t]) => `${RVN[k] || k}:\n${t}`).join("\n\n"))}</div></details>` : ""}</div>`).join("");
  return `<div class="rv"><div class="sub" style="margin-top:8px">${v.status === "reviewing" ? "Прошлое ревью" : "Ревью"}${fin.round != null ? " · круг " + esc(fin.round) : ""}</div>
    <div class="chips">${verd(fin.verdict)}${scChips(fin.scores)}<span class="chip ${n ? "lo" : "hi"}">⛔ блокеров ${n}</span></div>
    ${n ? `<div class="note">${esc(blTxt(bl))}</div>` : ""}
    ${sum ? `<details><summary>Что сказали ревьюеры</summary><div class="text">${esc(sum)}</div></details>` : ""}
    ${rs.length ? `<details><summary>История кругов · ${rs.length}</summary>${hist}</details>` : ""}</div>`;
}
// часть/картинка: fetch (с прогрессом) → AES-GCM → objectURL, кэш по пути. 01.11: части длинных теперь 20/60 с (~2-7 МБ,
// как короткие ~12 МБ, которые на iPhone играют), раньше 4 мин ~36 МБ качались 70+ с при 0.5 МБ/с без прогресса.
// 08.11 (Алексей: «ни хрена не грузится»): у каждого источника сторож. Нет ответа или байтов 20 с — обрываем
// и берём следующий источник (raw → API → Pages), а не висим молча на «загружаю».
async function fetchBuf(path, onp) {
  let last = null;
  for (const s of mediaSrcs(path)) {
    if (s.api && Date.now() < API_OFF) continue;
    const ac = new AbortController(); let tm = setTimeout(() => ac.abort(), 20e3);
    const kick = () => { clearTimeout(tm); tm = setTimeout(() => ac.abort(), 20e3); };
    try {
      const r = await fetch(s.u, { ...(s.init || {}), signal: ac.signal });
      if (!r.ok) { if (s.api && (r.status === 403 || r.status === 429)) API_OFF = Date.now() + 15 * 60e3; last = new Error("HTTP " + r.status); clearTimeout(tm); continue; }
      kick();
      const tot = +r.headers.get("content-length") || 0;
      if (!r.body || !r.body.getReader) { const b = await r.arrayBuffer(); clearTimeout(tm); if (onp) onp(b.byteLength, b.byteLength); return b; }
      const rd = r.body.getReader(), ch = []; let got = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; kick(); ch.push(value); got += value.length; if (onp) onp(got, tot); }
      clearTimeout(tm);
      const all = new Uint8Array(got); let o = 0; for (const c of ch) { all.set(c, o); o += c.length; } return all.buffer;
    } catch (e) { clearTimeout(tm); last = e.name === "AbortError" ? new Error("источник молчит 20 с, пробую другой") : e; if (onp) onp(0, 0); }
  }
  throw last || new Error("нет источника");
}
const APPV = "12.11p0";   // версия страницы в шапке: видно, что телефон открыл новую
function bar(el, g, t) { const b = el && el.querySelector(".bar i"); if (b) { b.parentNode.style.display = ""; b.style.width = (t ? Math.min(100, g / t * 100) : 5) + "%"; } }
async function blobUrl(path, type, onp) {
  if (!PURL[path]) PURL[path] = fetchBuf(path, (g, t) => { const f = PROG[path]; if (f) f(g, t); }).then(open).then((p) => URL.createObjectURL(new Blob([p], { type })));
  if (onp) PROG[path] = onp;
  try { return await PURL[path]; } catch (e) { delete PURL[path]; throw e; } finally { if (PROG[path] === onp) delete PROG[path]; }
}
const PROG = {};
function dropUrl(path) { const p = PURL[path]; if (p) { delete PURL[path]; p.then((u) => URL.revokeObjectURL(u)).catch(() => {}); } }
function longMount() {
  document.querySelectorAll("details.ch").forEach((d) => d.addEventListener("toggle", () => { d.open ? LOPEN.add(d.dataset.ch) : LOPEN.delete(d.dataset.ch); try { localStorage.setItem("chaga_lopen", JSON.stringify([...LOPEN])); } catch (e) {} }));
  document.querySelectorAll("img[data-img]").forEach((im) => {
    const p = im.dataset.img; if (IMG[p]) { im.src = IMG[p]; return; }
    blobUrl(p, "image/jpeg").then((u) => { IMG[p] = u; im.src = u; }).catch(() => {});
  });
  document.querySelectorAll("details[data-clip]").forEach((d) => {
    const p = d.dataset.clip, v = d.querySelector("video");
    const go = () => { if (!v.getAttribute("src")) blobUrl(p, "video/mp4").then((u) => { v.src = u; }).catch(() => {}); };
    if (d.open) go(); d.addEventListener("toggle", () => d.open && go());
  });
  document.querySelectorAll("[data-lv]").forEach((box) => {
    const key = box.dataset.lv, old = LP[key];
    if (old && old.parts === box.dataset.parts) { box.replaceWith(old.el); if (old.was) old.v.play().catch(() => {}); return; }
    const P = JSON.parse(box.dataset.parts), v = box.querySelector("video"), st = box.querySelector(".lvst");
    const S = LP[key] = { el: box, v, parts: box.dataset.parts, k: -1, playing: false };
    const base = st.textContent, total = P.reduce((a, p) => a + (p.d || 0), 0);
    const say = (t, bad) => { st.textContent = t; st.classList.toggle("err", !!bad); };
    const mark = () => box.querySelectorAll(".parts button").forEach((b) => b.classList.toggle("on", +b.dataset.k === S.k));
    const info = (k) => `Часть ${k + 1} из ${P.length} · ${mmss(P[k].at)}-${mmss(P[k].at + P[k].d)} из ${mmss(total)}`;
    // 01.11 iPhone: play() разрешён только в жесте пользователя. Жест теряется, пока часть качается, поэтому
    // в самом нажатии «будим» плеер (play() внутри жеста снимает запрет на этот <video>), а уже скачанную часть
    // (первая качается заранее) ставим сразу. Если iOS всё же не дал включить, пишем «нажми ▶», а не молчим.
    function go(auto) {
      if (!auto) return;
      const pr = v.play(); if (pr) pr.catch((e) => { if (e && e.name === "NotAllowedError") say(info(S.k) + " · нажми ▶ на видео"); });
    }
    async function play(k, auto, gesture) {
      if (k < 0 || k >= P.length) return;
      S.k = k; mark(); v.style.display = "";
      if (gesture && !v.getAttribute("src")) { try { v.play().catch(() => {}); } catch (e) {} }
      say(`Часть ${k + 1} из ${P.length}: загружаю ${P[k].mb} МБ…`);
      const t0 = Date.now();
      try {
        const u = await blobUrl(P[k].p, "video/mp4", (g, t) => { if (S.k === k) { bar(box, g, t || P[k].mb * 1e6); say(`Часть ${k + 1} из ${P.length}: загружаю ${(g / 1e6).toFixed(1)} из ${((t || P[k].mb * 1e6) / 1e6).toFixed(1)} МБ${Date.now() - t0 > 20e3 ? " (медленная сеть)" : ""}…`); } });
        { const bb = box.querySelector(".bar"); if (bb) bb.style.display = "none"; }
        if (S.k !== k) return;
        if (v.getAttribute("src") !== u) v.src = u;
        say(`${info(k)} · ${base}`);
        go(auto);
        for (const [j, p] of P.entries()) if (j !== k && j !== k + 1) dropUrl(p.p);   // в памяти только текущая и следующая
        if (k + 1 < P.length) blobUrl(P[k + 1].p, "video/mp4").catch(() => {});      // следующую качаем заранее
      } catch (e) { say(`Часть ${k + 1}: не загрузилась (${e.message || e}). Нажми на часть ещё раз.`, true); }
    }
    box.querySelectorAll(".parts button, a[data-k]").forEach((b) => b.onclick = (e) => { e.preventDefault(); play(+b.dataset.k, true, true); });
    v.addEventListener("error", () => {             // 01.11: ошибка плеера видна на экране, а не тишина
      const c = v.error && v.error.code, why = { 1: "прервано", 2: "сеть", 3: "не декодируется", 4: "формат не поддерживается" }[c] || "неизвестно";
      if (S.k >= 0 && v.getAttribute("src")) say(`Часть ${S.k + 1}: плеер не смог включить видео (${why}, код ${c}). Нажми на часть ещё раз.`, true);
    });
    v.addEventListener("ended", () => { S.playing = false; play(S.k + 1, true); });
    v.addEventListener("play", () => { S.playing = true; for (const o of Object.values(LP)) if (o !== S && !o.v.paused) o.v.pause(); });
    v.addEventListener("pause", () => { S.playing = false; });
    // первая часть (~2-3 МБ) заранее: у «Ждут проверки» сразу, в карточке канала, когда она открыта: старт сразу по нажатию
    const pre = () => { if (P.length && S.k < 0) blobUrl(P[0].p, "video/mp4").catch(() => {}); };
    const ch = box.closest("details.ch");
    if (!ch || ch.open) pre(); else ch.addEventListener("toggle", () => ch.open && pre());
  });
}
load().catch((e) => document.getElementById("msg").textContent = "Не открылось: " + e.message);
setInterval(() => load().catch(() => {}), 60000);
</script>
