<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaga cartoons</title>
<meta name="robots" content="noindex">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f6f1e7; --card:#fffaf0; --ink:#2a1c14; --mute:#8a7a6a; --line:#e6dccb; --acc:#b8862b; --ok:#3f7a4f; --bad:#a3342f; --chip:#efe5d2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16131a; --card:#221d26; --ink:#f3ead9; --mute:#a397a8; --line:#352d3b; --acc:#ffc857; --ok:#7ccf8f; --bad:#ff8a7a; --chip:#2e2733; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 16px 8px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 8px; font:600 20px/1.2 Georgia, serif; letter-spacing:.06em; }
  h1 small { font:400 12px sans-serif; color:var(--mute); letter-spacing:0; margin-left:8px; }
  nav { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  nav button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:18px; padding:6px 12px; font-size:14px; }
  nav button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  main { padding:12px 16px 80px; max-width:760px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .top { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--mute); }
  .title { font:600 18px/1.3 Georgia, serif; margin:6px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip { background:var(--chip); border-radius:10px; padding:2px 8px; font-size:13px; }
  .chip.hi { color:var(--ok); } .chip.lo { color:var(--bad); }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--acc); font-size:14px; }
  .text { white-space:pre-wrap; margin-top:8px; }
  video { width:100%; border-radius:10px; margin-top:8px; background:#000; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .btns a { text-align:center; text-decoration:none; padding:10px; border-radius:10px; border:1px solid var(--line); color:var(--ink); font-size:15px; }
  .btns a.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .hist { font-size:13px; color:var(--mute); margin-top:6px; white-space:pre-wrap; }
  .empty, #msg { color:var(--mute); text-align:center; padding:40px 0; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; transition:transform .25s; max-width:calc(100% - 32px); z-index:9; }
  #toast.show { transform:translateX(-50%) translateY(0); }
  .post { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .sec { font:600 15px/1.3 sans-serif; color:var(--mute); margin:18px 2px 8px; text-transform:uppercase; letter-spacing:.05em; }
  .sec:first-child { margin-top:4px; }
  .ch > summary { list-style:none; display:flex; gap:12px; align-items:center; color:var(--ink); }
  .ch > summary::-webkit-details-marker { display:none; }
  .ava { flex:none; width:52px; height:52px; border-radius:50%; object-fit:cover; background:var(--chip); display:flex; align-items:center; justify-content:center; font:700 18px Georgia, serif; color:#fff; overflow:hidden; }
  .ava.sm { width:28px; height:28px; font-size:11px; }
  .chn { flex:1; min-width:0; } .chn b { font:600 17px/1.25 Georgia, serif; display:block; } .chn small { color:var(--mute); font-size:13px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ban { width:100%; aspect-ratio:16/9; border-radius:10px; margin-top:10px; object-fit:cover; display:block; }
  .ban.ph { display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font:600 20px Georgia, serif; padding:12px; aspect-ratio:auto; min-height:90px; }
  .ban.ph small { display:block; font:400 12px sans-serif; opacity:.8; margin-top:4px; }
  .sub { font-weight:600; margin:14px 0 4px; }
  .lvid { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .lvid:first-of-type { border-top:0; }
  .parts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .parts button { border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:8px; padding:5px 9px; font-size:13px; }
  .parts button.on { background:var(--acc); color:#000; border-color:var(--acc); }
  .lvst { font-size:13px; color:var(--mute); margin-top:4px; }
  .note { font-size:14px; color:var(--mute); margin-top:6px; }
  .btns.two { grid-template-columns:1fr 1fr; }
  .post .tm { font-weight:700; min-width:44px; } .post .ttl { flex:1 1 160px; } .post.published { opacity:.75; } .post .err { width:100%; color:#c0392b; font-size:12px; }
</style>
</head>
<body>
<header><h1>CHAGA CARTOONS<small id="upd"></small></h1><nav id="tabs"></nav></header>
<main id="list"><div id="msg">Загружаю…</div></main>
<script>
const TG = window.Telegram && Telegram.WebApp; if (TG) { TG.ready(); TG.expand(); }
const K = new URLSearchParams(location.hash.slice(1)).get("k") || localStorage.getItem("chaga_k");
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
let D = null, TAB = localStorage.getItem("chaga_tab") || "you-s";
if (TAB === "you") TAB = "you-s";
// «Ждут тебя» делится на две папки и стоит первой: сценарии и готовые ролики
const YOU = { "you-s": ["📝 Сценарии ждут тебя", "script"], "you-r": ["🎬 Ролики ждут тебя", "reel"] };
const inTab = (i, t) => YOU[t] ? i.status === "you" && i.kind === YOU[t][1] : i.status === t;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https:\/\//i.test(String(u || "")) ? esc(u) : "";   // только https: никаких javascript:

async function open(buf) {
  const ck = await crypto.subtle.importKey("raw", b64(K), "AES-GCM", false, ["decrypt"]);
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, ck, u.slice(12));
}
async function load() {
  if (!K) { document.getElementById("msg").textContent = "Нет ключа: открой ссылку из бота (/app)."; return; }
  try { localStorage.setItem("chaga_k", K); } catch (e) {}
  const r = await fetch("data.bin?" + Date.now(), { cache: "no-store" });
  const plain = await open(await r.arrayBuffer());
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  if (txt === LAST) return;                        // 30.10: данные не менялись: не перерисовываем (раньше раз в минуту обнулялся ролик)
  LAST = txt; D = JSON.parse(txt);
  for (const c of pend()) {
    if (String(c.id || "").startsWith("L-")) { const v = longAll().find((x) => x.id === c.id); if (v && v.status === "ready") setLocal(c.id, c.st, ""); continue; }
    const it = c.id && D.items.find((x) => x.id === c.id); if (it && it.status === "you") it.status = c.st;
  }   // команды из очереди: статус не откатывается
  render();
}
let LAST = "";
const VID = {};                                     // плееры по пути ролика: переживают перерисовку, позиция и воспроизведение сохраняются
// кнопки работают в самом приложении: команда шифруется ключом приложения и уходит в закрытый ящик ntfy.sh
// (адрес ящика выводится из ключа), бот забирает её каждые 30 с. Без ключа команду не подделать.
async function topic() { const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("chaga-cmd:" + K))); return "chaga-" + Array.from(h.slice(0, 16), (x) => x.toString(16).padStart(2, "0")).join(""); }
async function seal(obj) {
  const ck = await crypto.subtle.importKey("raw", b64(K), "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  let raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream)                    // gzip: длинные правки влезают в лимит ntfy (4 КБ), бот распакует
    raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, ck, raw));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return btoa(String.fromCharCode(...all));
}
function toast(t) { let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); } el.textContent = t; el.className = "show"; clearTimeout(el._t); el._t = setTimeout(() => el.className = "", 2600); }
const LABEL = { ap: "✅ Беру", ed: "✏️ Правки", rw: "❌ Переделать", tr: "🗑 В мусор", vo: "🎙 Голосом", la: "✅ Одобрено", le: "✏️ Замечание" }, NEXT = { ap: "approved", ed: "edits", rw: "edits", tr: "rejected", la: "L:approved", le: "L:edits" };
// локальный статус после кнопки (до подтверждения ботом): короткие в D.items, длинные (id L-...) в D.long
function setLocal(id, st, text) {
  if (String(id).startsWith("L-")) { const v = longAll().find((x) => x.id === id); if (v && st) { v.status = st.replace(/^L:/, ""); v.label = (D.long.statuses || {})[v.status] || v.status; if (text) (v.notes = v.notes || []).push("сейчас " + text); } return; }
  const it = D.items.find((x) => x.id === id); if (it) { it.status = st; if (text) it.notes = ((it.notes || "") + "\n" + text).trim(); }
}
// очередь неотправленных команд (лимит ntfy / нет сети): повтор раз в 2 минуты и при каждом открытии, команды уже зашифрованы
function pend() { try { return JSON.parse(localStorage.getItem("chaga_pending") || "[]"); } catch (e) { return []; } }
function queue(body, id, st) { const q = pend(); q.push({ body, id, st }); try { localStorage.setItem("chaga_pending", JSON.stringify(q)); } catch (e) {} }
async function flush() {
  let q = pend(); if (!q.length || !K) return; const sent = q.length;
  while (q.length) {
    let r = null; try { r = await fetch("https://ntfy.sh/" + await topic(), { method: "POST", body: q[0].body || q[0] }); } catch (x) {}
    if (!r || !r.ok) break;
    q.shift(); try { localStorage.setItem("chaga_pending", JSON.stringify(q)); } catch (e) {}
  }
  if (q.length < sent) toast(`Дослал из очереди: ${sent - q.length}${q.length ? ", ждут ещё " + q.length : ""}.`);
}
setInterval(flush, 120e3); setTimeout(flush, 3e3);
async function act(a, id) {
  let text = "";
  if (a === "ed" || a === "rw" || a === "le") { text = prompt(a === "ed" ? "Правки к карточке (одним сообщением):" : a === "le" ? "Замечание к длинному ролику (одним сообщением):" : "Что не так? (можно пусто)") ?? null; if (text === null) return; if ((a === "ed" || a === "le") && !text.trim()) return;
  }
  try {
    const body = await seal({ a, id, text: text.trim(), ts: Date.now(), n: crypto.getRandomValues(new Uint32Array(2)).join("") });
    // ntfy превращает сообщения > 4096 байт во вложение, и бот их не прочтёт: не отправляем, просим разделить
    if (body.length > 3800) { toast("Слишком длинная правка для одной отправки. Раздели на части и отправь по очереди."); return; }
    let r = null; try { r = await fetch("https://ntfy.sh/" + await topic(), { method: "POST", body }); } catch (x) {}
    // 30.10: лимит ntfy (429, ~250 сообщений в сутки на IP, сброс 00:00 UTC) или нет сети: команда в очередь, приложение дошлёт само
    if (!r || r.status === 429 || r.status >= 500) {
      if (a === "vo") throw new Error(r ? "ntfy " + r.status : "нет сети");
      queue(body, id, NEXT[a]); setLocal(id, NEXT[a], text.trim());
      toast(`${LABEL[a]}: ${id}. ntfy ${r ? "упёрся в дневной лимит" : "недоступен"}, сохранил в очередь: дошлю сам, как откроется.`); render(); return;
    }
    if (!r.ok) throw new Error("ntfy " + r.status);
    if (a === "vo") {                                // бот ждёт голосовое следующим сообщением: закрываем приложение и идём в чат
      toast("🎙 Бот ждёт голосовое по " + id + ". Запиши его в чате.");
      if (TG) setTimeout(() => TG.close(), 700); else setTimeout(() => { location.href = "https://t.me/chaga_cartoons_bot"; }, 700);
      return;
    }
    setLocal(id, NEXT[a], text.trim());
    toast(`${LABEL[a]}: ${id}. Бот запишет за полминуты.`); render();
  } catch (e) { toast("Не отправилось: " + e.message + ". Попробуй ещё раз."); }
}
async function video(el, path) {
  if (el.dataset.done) return; el.dataset.done = 1;
  if (VID[path]) return;
  const v = el.querySelector("video"); VID[path] = v;
  const r = await fetch(path); const plain = await open(await r.arrayBuffer());
  v.src = URL.createObjectURL(new Blob([plain], { type: "video/mp4" }));
}
function render() {
  const items = D.items, tabs = document.getElementById("tabs");
  const up = (D.posts || []).filter((p) => p.status === "scheduled").length;
  const tabList = [...Object.entries(YOU).map(([k, v]) => [k, v[0]]), ...Object.entries(D.status).filter(([k]) => k !== "you")];
  const btn = ([k, v]) => {
    const n = items.filter((i) => inTab(i, k)).length;
    return `<button class="${k === TAB ? "on" : ""}" data-t="${esc(k)}">${esc(v)}${n ? " " + n : ""}</button>`;
  };
  // 31.10: «🎞 Длинные» третьей кнопкой, сразу после двух «Ждут тебя»; 👀N = длинные, ждущие проверки
  const lw = longAll().filter((v) => v.status === "ready").length;
  const lb = `<button class="${TAB === "long" ? "on" : ""}" data-t="long">🎞 Длинные${lw ? " 👀" + lw : ""}</button>`;
  tabs.innerHTML = tabList.slice(0, 2).map(btn).join("") + lb + tabList.slice(2).map(btn).join("")
    + `<button class="${TAB === "cal" ? "on" : ""}" data-t="cal">📅 Выкладка${up ? " " + up : ""}</button>`;
  tabs.querySelectorAll("button").forEach((b) => b.onclick = () => { TAB = b.dataset.t; try { localStorage.setItem("chaga_tab", TAB); } catch (e) {} render(); });
  const list = items.filter((i) => inTab(i, TAB));
  const playing = Object.values(VID).filter((v) => !v.paused && !v.ended);
  Object.values(LP).forEach((o) => { o.was = !o.v.paused && !o.v.ended; });   // длинные: снятый с экрана плеер браузер ставит на паузу
  document.getElementById("list").innerHTML = TAB === "cal" ? calendar() : TAB === "long" ? longView() : list.length ? list.map(card).join("") : `<div class="empty">Пусто</div>`;
  if (TAB === "long") longMount();
  document.querySelectorAll("[data-a]").forEach((b) => b.onclick = (e) => { e.preventDefault(); act(b.dataset.a, b.dataset.id); });
  document.querySelectorAll("details[data-v]").forEach((d) => {
    const v = VID[d.dataset.v]; if (v) { d.querySelector("video").replaceWith(v); d.dataset.done = 1; if (playing.includes(v)) v.play().catch(() => {}); }
    d.addEventListener("toggle", () => d.open && video(d, d.dataset.v));
  });
  const last = items.map((i) => i.updated).filter(Boolean)[0]; document.getElementById("upd").textContent = last ? "обновлено " + last : "";
}
// календарь выкладки: по дням (Алматы), что и куда выходит, что уже вышло
const PL = { instagram: "📸 Instagram", tiktok: "🎵 TikTok", youtube: "▶️ YouTube" }, ST = { scheduled: "⏳ запланирован", processing: "⏳ публикуется", published: "✅ вышел", failed: "⚠️ ошибка", deleted: "🗑 снят", unknown: "❔ проверяю", skipped: "⏭ пропущен" };
function calendar() {
  const ps = D.posts || [];
  if (!ps.length) return `<div class="empty">Пока ничего не запланировано. Ролик встаёт в расписание после твоего ✅.</div>`;
  const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Almaty" });
  const days = [...new Set(ps.map((p) => p.day))].sort();
  return days.map((d) => {
    const label = new Date(d + "T12:00:00").toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
    const rows = ps.filter((p) => p.day === d).map((p) => `<div class="post ${esc(p.status)}"><span class="tm">${esc(p.time)}</span>
      <span>${p.lang === "en" ? "🇺🇸" : "🇷🇺"} ${PL[p.platform] || esc(p.platform)}${p.role === "trial" ? " · Trial reels" : ""}</span>
      <span class="ttl">${esc(p.title)}</span><span class="chip">${ST[p.status] || esc(p.status)}</span>
      ${safeUrl(p.url) ? `<a href="${safeUrl(p.url)}" target="_blank" rel="noopener">открыть</a>` : ""}${p.error ? `<div class="err">${esc(p.error)}</div>` : ""}</div>`).join("");
    return `<div class="card"><div class="title">${d === today ? "Сегодня · " : ""}${label}</div>${rows}</div>`;
  }).join("");
}
function card(i) {
  const flag = i.lang === "en" ? "🇺🇸" : "🇷🇺", kind = i.kind === "reel" ? "🎬 Ролик" : "📝 Сценарий";
  const sc = Object.entries(i.scores || {}).map(([k, v]) => `<span class="chip ${v >= 8 ? "hi" : v < 7 ? "lo" : ""}">${esc(k)} ${esc(v)}</span>`).join("");
  const meta = [i.rubric, i.style, i.seconds ? `~${i.seconds} с` : "", i.stage].filter(Boolean).map((x) => `<span class="chip">${esc(x)}</span>`).join("");
  const vid = i.video ? `<details data-v="${esc(i.video)}" open><summary>Видео</summary><video controls playsinline preload="none"></video></details>` : "";
  const btns = i.status === "you" ? `<div class="btns"><a class="ok" data-a="ap" data-id="${esc(i.id)}" href="#">✅ Беру</a><a data-a="ed" data-id="${esc(i.id)}" href="#">✏️ Правки</a><a data-a="vo" data-id="${esc(i.id)}" href="#">🎙 Голосом</a><a data-a="rw" data-id="${esc(i.id)}" href="#">❌ Переделать</a><a data-a="tr" data-id="${esc(i.id)}" href="#">🗑 Мусор</a></div>` : "";
  return `<div class="card"><div class="top"><span>${kind} ${flag} ${esc(i.id)}</span><span>${esc(i.updated || "")}</span></div>
    <div class="title">${esc(i.title)}</div><div class="chips">${meta}</div><div class="chips">${sc}</div>${vid}
    ${i.text ? `<details${i.kind === "script" && i.status === "you" ? " open" : ""}><summary>Текст</summary><div class="text">${esc(i.text)}</div></details>` : ""}
    ${i.caption ? `<details${i.kind === "reel" ? " open" : ""}><summary>Подпись к ролику</summary><div class="text">${esc(i.caption)}</div></details>` : ""}
    ${i.review ? `<details><summary>Что исправили ревьюеры</summary><div class="text">${esc(i.review)}</div></details>` : ""}
    ${i.notes ? `<details open><summary>Твои правки</summary><div class="text">${esc(i.notes)}</div></details>` : ""}
    ${btns}
    ${(i.history || []).length ? `<details><summary>История</summary><div class="hist">${esc(i.history.slice(-8).join("\n"))}</div></details>` : ""}</div>`;
}
// ===== 31.10 «🎞 Длинные»: 10 каналов сети longform-studio + Chaga Movies long (данные engine/long_sync.py) =====
const longAll = () => ((D && D.long && D.long.channels) || []).flatMap((c) => (c.videos || []).map((v) => Object.assign(v, { _ch: c })));
const LOPEN = new Set(JSON.parse((() => { try { return localStorage.getItem("chaga_lopen") || "[]"; } catch (e) { return "[]"; } })()));
const IMG = {}, LP = {}, PURL = {};                 // картинки, плееры длинных, расшифрованные части (переживают перерисовку)
const mmss = (s) => s == null ? "" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = (n) => String(n).split(/\s+/).filter((w) => !/^the$/i.test(w)).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
function ava(c, sm) {
  const cls = "ava" + (sm ? " sm" : "");
  return c.avatar ? `<img class="${cls}" data-img="${esc(c.avatar)}" alt="">` : `<div class="${cls}" style="background:hsl(${hue(c.slug)} 45% 38%)">${esc(initials(c.name))}</div>`;
}
function longView() {
  const L = D.long;
  if (!L || L.error || !L.channels) return `<div class="empty">Раздел длинных пока не собрался${L && L.error ? ": " + esc(L.error) : ""}.</div>`;
  const all = longAll(), wait = all.filter((v) => v.status === "ready");
  let h = `<div class="sec">👀 Ждут проверки · ${wait.length}</div>`;
  h += wait.length ? wait.map((v) => `<div class="card">${lvid(v, true)}</div>`).join("")
    : `<div class="card note">Готовых длинных пока нет. Как только у ролика появится финальный mp4, он встанет сюда с видео и кнопками.</div>`;
  const ok = all.filter((v) => v.status === "approved").length, work = all.filter((v) => ["voiced", "anim", "render", "edits"].includes(v.status)).length;
  h += `<div class="sec">Каналы · ${L.channels.length} · в работе ${work}${ok ? " · одобрено " + ok : ""}</div>`;
  return h + L.channels.map(chCard).join("");
}
function chCard(c) {
  const st = (c.videos || []).map((v) => `<span class="chip">${esc(v.label)}</span>`).join("");
  const ban = c.banner ? `<img class="ban" data-img="${esc(c.banner)}" alt="">`
    : `<div class="ban ph" style="background:linear-gradient(120deg,hsl(${hue(c.slug)} 45% 30%),hsl(${(hue(c.slug) + 40) % 360} 50% 45%))"><div>${esc(c.name)}<small>${c.chaga ? "баннер и аватарка: позже" : "баннер и аватарка появятся после prompts/BRAND.md"}</small></div></div>`;
  const sample = c.sample ? `<details><summary>Пробный кадр стиля</summary><img class="ban" data-img="${esc(c.sample)}" alt=""></details>` : "";
  const meta = [c.wave ? `волна ${c.wave}` : "", c.niche].filter(Boolean).join(" · ");
  const about = c.about ? `<div class="sub">About</div><div class="text" style="margin-top:0">${esc(c.about)}</div>` : "";
  const alt = (c.alt || []).length || (c.handles || []).length ? `<div class="note">${c.alt.length ? "Другие названия: " + esc(c.alt.join(", ")) : ""}${c.handles.length ? `<br>Хэндлы: ${esc(c.handles.join(" "))}` : ""}</div>` : "";
  const vids = (c.videos || []).map((v) => lvid(v, false)).join("") || `<div class="note">Роликов пока нет.</div>`;
  const scr = (c.scripts || []).map((s) => `<div class="lvid"><div><b>${esc(s.topic || s.title)}</b></div>
    <div class="chips">${s.words ? `<span class="chip">${esc(s.words)} слов</span>` : ""}${s.minutes ? `<span class="chip">~${esc(s.minutes)} мин</span>` : ""}${(s.chapters || []).length ? `<span class="chip">${s.chapters.length} глав</span>` : ""}</div>
    ${s.title && s.title !== s.topic ? `<div class="note">Название: ${esc(s.title)}</div>` : ""}
    ${(s.alt_titles || []).length > 1 ? `<details><summary>Варианты названия (A/B)</summary><div class="text">${esc(s.alt_titles.join("\n"))}</div></details>` : ""}
    ${s.desc ? `<div class="note">Описание: ${esc(s.desc)}</div>` : ""}
    <details><summary>Текст (EN)</summary><div class="text">${esc(s.text)}</div></details>
    <details><summary>Перевод (RU)</summary><div class="text">${esc(s.ru || s.ru_note || "Перевода нет.")}</div></details></div>`).join("");
  const top = (c.topics || []).length ? `<details><summary>Очередь тем · ${c.topics.length}</summary><div class="text">${esc(c.topics.map((t, i) => `${i + 1}. ${t.title}`).join("\n"))}</div></details>` : "";
  return `<details class="card ch" data-ch="${esc(c.slug)}"${LOPEN.has(c.slug) ? " open" : ""}><summary>${ava(c)}<div class="chn"><b>${esc(c.name)}</b><small>${esc(meta)}</small><div class="chips">${st}</div></div></summary>
    ${ban}${sample}${about}${alt}<div class="sub">Ролики</div>${vids}<div class="sub">Сценарии</div>${scr}${top}</details>`;
}
function lvid(v, top) {
  const c = v._ch, chips = [v.label, v.duration ? mmss(v.duration) : v.voice_s ? `голос ${mmss(v.voice_s)}` : "", v.stage, top ? "" : v.updated].filter(Boolean).map((x) => `<span class="chip">${esc(x)}</span>`).join("");
  const head = top ? `<div class="top"><span style="display:flex;gap:8px;align-items:center">${ava(c, true)}${esc(c.name)}</span><span>${esc(v.updated || "")}</span></div>` : "";
  let vid = "";
  if (v.video && (v.video.parts || []).length) {
    const P = v.video.parts;
    vid = `<div data-lv="${esc(v.id)}@${top ? "t" : "c"}" data-parts='${esc(JSON.stringify(P))}'><div class="parts">${P.map((p, k) => `<button data-k="${k}">${P.length > 1 ? "Часть " + (k + 1) + " · " : "▶ "}${mmss(p.at)}</button>`).join("")}</div>
      <video controls playsinline preload="none" style="display:none"></video><div class="lvst">720p · ${esc(v.video.mb || "")} МБ всего · ${P.length > 1 ? P.length + " частей по 4 мин, следующая включается сама" : "одна часть"}</div></div>`;
  } else if (v.vnote) vid = `<div class="note">${esc(v.vnote)}</div>`;
  const can = ["ready", "edits", "approved"].includes(v.status);
  const btns = can ? `<div class="btns two">${v.status !== "approved" ? `<a class="ok" data-a="la" data-id="${esc(v.id)}" href="#">✅ Одобрить</a>` : `<a>✅ Одобрен</a>`}<a data-a="le" data-id="${esc(v.id)}" href="#">✏️ Замечание</a></div>` : "";
  const notes = (v.notes || []).length ? `<details${v.status === "edits" ? " open" : ""}><summary>Твои замечания</summary><div class="text">${esc(v.notes.join("\n"))}</div></details>` : "";
  const err = v.error ? `<div class="note" style="color:var(--bad)">${esc(v.error)}</div>` : "";
  return `<div class="lvid">${head}<div class="title" style="font-size:16px">${esc(v.title)}</div><div class="chips">${chips}</div>${err}${vid}${btns}${notes}
    ${(v.history || []).length ? `<details><summary>История</summary><div class="hist">${esc(v.history.join("\n"))}</div></details>` : ""}</div>`;
}
async function blobUrl(path, type) {                // часть/картинка: fetch → AES-GCM → objectURL (кэш по пути)
  if (!PURL[path]) PURL[path] = fetch(path).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); }).then(open).then((p) => URL.createObjectURL(new Blob([p], { type })));
  try { return await PURL[path]; } catch (e) { delete PURL[path]; throw e; }
}
function dropUrl(path) { const p = PURL[path]; if (p) { delete PURL[path]; p.then((u) => URL.revokeObjectURL(u)).catch(() => {}); } }
function longMount() {
  document.querySelectorAll("details.ch").forEach((d) => d.addEventListener("toggle", () => { d.open ? LOPEN.add(d.dataset.ch) : LOPEN.delete(d.dataset.ch); try { localStorage.setItem("chaga_lopen", JSON.stringify([...LOPEN])); } catch (e) {} }));
  document.querySelectorAll("img[data-img]").forEach((im) => {
    const p = im.dataset.img; if (IMG[p]) { im.src = IMG[p]; return; }
    blobUrl(p, "image/jpeg").then((u) => { IMG[p] = u; im.src = u; }).catch(() => {});
  });
  document.querySelectorAll("[data-lv]").forEach((box) => {
    const key = box.dataset.lv, old = LP[key];
    if (old && old.parts === box.dataset.parts) { box.replaceWith(old.el); if (old.was) old.v.play().catch(() => {}); return; }
    const P = JSON.parse(box.dataset.parts), v = box.querySelector("video"), st = box.querySelector(".lvst");
    const S = LP[key] = { el: box, v, parts: box.dataset.parts, k: -1, playing: false };
    const base = st.textContent;
    const mark = () => box.querySelectorAll(".parts button").forEach((b) => b.classList.toggle("on", +b.dataset.k === S.k));
    async function play(k, auto) {
      if (k < 0 || k >= P.length) return;
      S.k = k; mark(); v.style.display = ""; st.textContent = `Часть ${k + 1} из ${P.length}: загружаю ${P[k].mb} МБ…`;
      try {
        const u = await blobUrl(P[k].p, "video/mp4"); if (S.k !== k) return;
        v.src = u; st.textContent = `Часть ${k + 1} из ${P.length} · ${mmss(P[k].at)}-${mmss(P[k].at + P[k].d)} · ${base}`;
        if (auto) v.play().catch(() => {});
        for (const [j, p] of P.entries()) if (Math.abs(j - k) > 1) dropUrl(p.p);   // в памяти не больше трёх частей
        if (k + 1 < P.length) blobUrl(P[k + 1].p, "video/mp4").catch(() => {});      // следующую качаем заранее
      } catch (e) { st.textContent = `Часть ${k + 1}: не загрузилась (${e.message}). Нажми ещё раз.`; }
    }
    box.querySelectorAll(".parts button").forEach((b) => b.onclick = () => play(+b.dataset.k, true));
    v.addEventListener("ended", () => { S.playing = false; play(S.k + 1, true); });
    v.addEventListener("play", () => { S.playing = true; for (const o of Object.values(LP)) if (o !== S && !o.v.paused) o.v.pause(); });
    v.addEventListener("pause", () => { S.playing = false; });
  });
}
load().catch((e) => document.getElementById("msg").textContent = "Не открылось: " + e.message);
setInterval(() => load().catch(() => {}), 60000);
</script>
